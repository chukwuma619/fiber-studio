# Build signed updater artifacts and publish a GitHub Release.
#
# Release:
#   1. cd app && bun run version:bump patch   # syncs package.json + Cargo.toml (Tauri reads package.json)
#   2. Commit and push to main.
#   3. git tag v0.1.0 && git push origin v0.1.0
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY
#   APPLE_CERTIFICATE            # base64-encoded Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD   # password set when exporting the .p12
#   APPLE_ID                     # Apple ID email
#   APPLE_PASSWORD               # app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID                # 10-char Team ID (developer.apple.com → Membership)
#   CERTUM_EMAIL                 # SimplySign login email (Windows Authenticode)
#   CERTUM_OTP                   # SimplySign TOTP seed / otpauth:// URI (not the 6-digit code)
# Optional:
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD

name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            fnn_triple: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            fnn_triple: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            fnn_triple: x86_64-unknown-linux-gnu
            rust_target: ""
          - platform: ubuntu-22.04-arm
            args: ""
            fnn_triple: aarch64-unknown-linux-gnu
            rust_target: ""
          - platform: windows-latest
            # NSIS only: Certum cloud signing via ssign supports PE (.exe), not MSI yet.
            args: --config src-tauri/tauri.windows-signing.conf.json
            fnn_triple: x86_64-pc-windows-msvc
            rust_target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Add Rust cross-compilation target
        if: matrix.rust_target != ''
        working-directory: .
        run: rustup target add ${{ matrix.rust_target }}

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-22.04')
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            patchelf \
            rpm \
            file \
            xdg-utils

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./app/src-tauri -> target
          prefix-key: v1-rust-${{ matrix.fnn_triple }}

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Fetch fnn sidecar binary
        run: bun run fetch-fnn -- --triple ${{ matrix.fnn_triple }}

      - name: Verify updater signing secret
        shell: bash
        working-directory: .
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Add the contents of app/src-tauri/.updater/fiber-studio.key as a repository secret. See README.md → Publishing a desktop release."
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Verify Apple signing secrets (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        working-directory: .
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Required for macOS code signing and notarization."
              missing=1
            fi
          done
          exit $missing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Import Apple Developer certificate (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: .
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          CERT_ID="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' \
            | head -1 \
            | sed -E 's/^[[:space:]]*[0-9]+\)[[:space:]]+[A-F0-9]+[[:space:]]+"([^"]+)".*/\1/')"

          if [ -z "$CERT_ID" ]; then
            echo "::error::Developer ID Application identity not found after importing certificate."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "Imported signing identity: $CERT_ID"
          rm -f "$CERT_PATH"

      - name: Verify Certum signing secrets (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        working-directory: .
        run: |
          missing=0
          for name in CERTUM_EMAIL CERTUM_OTP; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Required for Windows Authenticode with Certum SimplySign. See README.md → Windows Certum signing secrets."
              missing=1
            fi
          done
          exit $missing
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}

      # Certum cloud keys are not exportable as .pfx. Publish uses ssign-pkcs11
      # (https://github.com/Le-Syl21/ssign) + jsign so the OAuth session is cached
      # across Tauri's per-file signCommand invocations.
      - name: Set up Java (Windows Certum signing via jsign)
        if: matrix.platform == 'windows-latest'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install ssign-pkcs11 + jsign (Windows Certum signing)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: .
        run: |
          $ver = "v0.1.4"
          $dest = Join-Path $env:RUNNER_TEMP "ssign"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $pkcsZip = Join-Path $env:RUNNER_TEMP "ssign-pkcs11.zip"
          $pkcsUrl = "https://github.com/Le-Syl21/ssign/releases/download/$ver/ssign-pkcs11-windows-x86_64.zip"
          Invoke-WebRequest -Uri $pkcsUrl -OutFile $pkcsZip
          Expand-Archive -Path $pkcsZip -DestinationPath $dest -Force
          $dll = Get-ChildItem -Path $dest -Recurse -Filter ssign_pkcs11.dll | Select-Object -First 1
          if (-not $dll) { throw "ssign_pkcs11.dll not found after extracting $pkcsUrl" }

          $jsignJar = Join-Path $dest "jsign.jar"
          Invoke-WebRequest -Uri "https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar" -OutFile $jsignJar

          Copy-Item -Force "app/scripts/certum-code-signing-2021-ca.pem" (Join-Path $dest "certum-code-signing-2021-ca.pem")
          Copy-Item -Force "app/scripts/ssign-tauri.ps1" (Join-Path $dest "ssign-tauri.ps1")
          Copy-Item -Force "app/scripts/ssign-tauri.cmd" (Join-Path $dest "ssign-tauri.cmd")

          Add-Content -Path $env:GITHUB_PATH -Value $dest
          Add-Content -Path $env:GITHUB_ENV -Value "SSIGN_PKCS11_MODULE=$($dll.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "JSIGN_JAR=$jsignJar"
          # ssign-pkcs11 session cache (CloudSession) under RUNNER_TEMP/ssign/
          Add-Content -Path $env:GITHUB_ENV -Value "XDG_RUNTIME_DIR=$env:RUNNER_TEMP"

          java -jar $jsignJar --version
          $wrapper = Join-Path (Get-Location) "app/scripts/ssign-tauri.ps1"
          if (-not (Test-Path -LiteralPath $wrapper)) {
            throw "missing $wrapper (needed by tauri.windows-signing.conf.json)"
          }
          $fromTauri = Join-Path (Get-Location) "app/src-tauri/../scripts/ssign-tauri.ps1"
          if (-not (Test-Path -LiteralPath $fromTauri)) {
            throw "ssign-tauri.ps1 not reachable as ../scripts from app/src-tauri"
          }

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
          SSIGN_PKCS11_MODULE: ${{ env.SSIGN_PKCS11_MODULE }}
          JSIGN_JAR: ${{ env.JSIGN_JAR }}
          XDG_RUNTIME_DIR: ${{ env.XDG_RUNTIME_DIR }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Fiber Studio v__VERSION__
          generateReleaseNotes: true
          releaseBody: |
            Download the asset for your platform below.

            - **macOS:** `.dmg` for Apple Silicon or Intel
            - **Windows:** `-setup.exe` NSIS installer (Authenticode-signed)
            - **Linux:** `.AppImage` (`chmod +x` then run)

            In-app updates are available via **Settings → Updates**.
          prerelease: false
          args: ${{ matrix.args }}

      - name: Dump Certum signing log (Windows)
        if: failure() && matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: .
        run: |
          $log = Join-Path $env:RUNNER_TEMP "ssign-tauri.log"
          if (Test-Path -LiteralPath $log) {
            Write-Host "---- $log ----"
            Get-Content -LiteralPath $log
          } else {
            Write-Host "No ssign-tauri.log at $log"
          }
          Get-ChildItem -Path $env:RUNNER_TEMP -Filter "ssign-tauri-*.txt" -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "---- $($_.FullName) ----"
              Get-Content -LiteralPath $_.FullName
            }
